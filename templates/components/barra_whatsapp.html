<!-- Componente BarraWhatsAppFixa (CDU 3.4) -->
{#
  Fixa no rodapé no celular com altura 52px e suporte a safe-area
#}

{% macro barra_whatsapp_fixa(texto="Pedir pelo WhatsApp", url=None, id="barra-whatsapp-fixa") -%}
<aside class="barra-whatsapp-fixa" id="{{ id }}" aria-label="Ação rápida WhatsApp">
  <a href="{{ url or site_whatsapp_url }}"
     target="_blank"
     rel="noopener noreferrer"
     class="barra-whatsapp-fixa-btn"
     id="{{ id }}-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
    </svg>
    <span>{{ texto }}</span>
  </a>
</aside>
{%- endmacro %}

{{ barra_whatsapp_fixa() }}
